name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and check dist is committed
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Overflow, console and accessibility checks
        run: npm test
