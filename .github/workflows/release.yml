# Publishes to npm and cuts a GitHub release when a version tag is pushed:
#   npm version minor        (bumps package.json, commits, tags vX.Y.Z)
#   git push --follow-tags
# Needs an NPM_TOKEN repository secret (an npm "automation" token).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json ${v}"; exit 1; }
      - run: npm run check
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md dist/blueprint-paper.css dist/blueprint-paper.min.css dist/blueprint-paper.js
        env:
          GH_TOKEN: ${{ github.token }}
